[flake8]
max-line-length = 110
# E127/E128 (continuation-line visual-indent nitpicks) and E402 (module import
# not at top of file) are intentionally relaxed project-wide:
#   - E127/E128 fire on this codebase's preferred hanging-indent style for
#     multi-line function calls/dict literals and do not indicate a defect.
#   - E402 fires in report_generator.py solely because matplotlib requires
#     `matplotlib.use("Agg")` to run before `import matplotlib.pyplot`, which
#     is the correct, documented way to force a headless backend.
# See Milestone 3 Implementation Plan, "Code Review" section, for the full
# review notes this configuration reflects.
extend-ignore = E127,E128,E402
exclude = .git,__pycache__,reports,data
